<header class="barra">
  <strong>Panel de Jardín de Sele</strong>
  <span class="usuario">{{ usuario()?.name }} · {{ usuario()?.email }}</span>
</header>
<main class="contenido">
  <h1>Hola, {{ usuario()?.name }}</h1>
  <p>Desde aquí administras la tienda. Pronto: pedidos.</p>
  <nav class="secciones"><a routerLink="/admin/categorias">Categorías</a>
    <a routerLink="/admin/productos">Productos</a>
    <a routerLink="/admin/campanas">Campañas</a>
<a routerLink="/admin/inicio">Portada de inicio</a>
<a routerLink="/admin/categorias-inicio">Página de categorías</a></nav>

  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }

  <div class="acciones">
    <button type="button" (click)="cerrarSesion()" [disabled]="ocupado()">Cerrar sesión</button>
    <button type="button" class="secundario" (click)="cerrarTodas()" [disabled]="ocupado()">Cerrar todas las sesiones</button>
  </div>
</main>
