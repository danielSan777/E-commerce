<main class="cuenta">
  <form class="tarjeta" (submit)="entrar($event)" novalidate>
    <h1>Ingresar</h1>
    <p class="sub">Entra con tu correo y contraseña.</p>

    <label for="email">Correo</label>
    <input id="email" name="email" type="email" autocomplete="username" [(ngModel)]="email" required
      [attr.aria-invalid]="errores()['email'] ? true : null" />
    @if (errores()['email']) { <small class="campo-error">{{ errores()['email'] }}</small> }

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" [(ngModel)]="password" required
      [attr.aria-invalid]="errores()['password'] ? true : null" />
    @if (errores()['password']) { <small class="campo-error">{{ errores()['password'] }}</small> }

    @if (error()) {
      <div class="error" role="alert">
        <p>{{ error() }}</p>
        @for (d of detalle(); track d) { <p class="detalle">{{ d }}</p> }
      </div>
    }

    <button type="submit" [disabled]="enviando()">{{ enviando() ? 'Ingresando…' : 'Ingresar' }}</button>

    <p class="alterna">¿No tienes cuenta? <a routerLink="/crear-cuenta" queryParamsHandling="preserve">Crear cuenta</a></p>
  </form>
</main>
