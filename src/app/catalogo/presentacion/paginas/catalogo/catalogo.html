<div class="contenedor-general">

    <!-- Lado del texto. El @for con un solo elemento vuelve a crear el bloque en cada cambio
         de diapositiva, y así se repite la animación de entrada. -->
    <div class="contenedor-curvo">
        @for (slide of [slideActual()]; track slide.id) {
        <div class="slide-texto">
            <p class="pregunta">{{ slide.pregunta }}</p>

            <h1 class="titulo">{{ slide.titulo }}</h1>

            <p class="descripcion">{{ slide.descripcion }}</p>

            <button type="button" class="boton-coleccion">{{ slide.boton }}</button>
        </div>
        }
    </div>

    <!-- Imagen en forma circular -->
    <div class="imagen-circular">
        @for (slide of [slideActual()]; track slide.id) {
        <img class="slide-imagen" [src]="slide.imagen" [alt]="slide.titulo">
        }
    </div>

    <!-- Flechas: izquierda y derecha, encima de todo -->
    <button type="button" class="flecha flecha-izquierda" (click)="anterior()" aria-label="Anterior">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>

    <button type="button" class="flecha flecha-derecha" (click)="siguiente()" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>

    <!-- Puntos indicadores -->
    <div class="puntos">
        @for (slide of slides; track slide.id; let i = $index) {
        <button type="button" class="punto" [class.activo]="i === indice()" (click)="irA(i)"
            [attr.aria-label]="'Ir a la diapositiva ' + (i + 1)"></button>
        }
    </div>

</div>
